<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/logo-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0D2A4A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!--
      No static <title>/<meta description> here on purpose: every routed
      page renders <SEO> (src/components/common/SEO.tsx), which sets these
      via react-helmet-async. Helmet inserts its own tags rather than
      replacing pre-existing static ones, so hardcoding them here produced
      two conflicting <title> elements and two <meta name="description">
      elements in the prerendered HTML (scripts/prerender.mjs) — confusing
      for crawlers and plain invalid HTML (only one <title> is allowed).
      The only moment this is visibly empty is the brief instant on the
      bare "/" route before RootRedirect sends the browser to a language
      prefix, which has no SEO component of its own.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
