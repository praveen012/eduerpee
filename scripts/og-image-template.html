<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px;
    height: 630px;
    background: radial-gradient(circle at 18% 20%, #121A2C 0%, #070B14 55%, #070B14 100%);
    font-family: "Inter", "Space Grotesk", -apple-system, sans-serif;
    overflow: hidden;
    position: relative;
  }
  .glow {
    position: absolute;
    border-radius: 9999px;
    filter: blur(80px);
  }
  .glow-orange { width: 520px; height: 520px; right: -140px; top: -160px; background: rgba(232, 100, 10, 0.28); }
  .glow-blue { width: 420px; height: 420px; left: -120px; bottom: -160px; background: rgba(21, 101, 192, 0.22); }
  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 48px 48px;
  }
  .content {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 90px;
  }
  .logo-row { display: flex; align-items: center; gap: 20px; margin-bottom: 44px; }
  .mark {
    width: 72px; height: 72px; border-radius: 16px;
    background: #0D2A4A;
    display: flex; align-items: center; justify-content: center;
  }
  .mark svg { width: 44px; height: 44px; }
  .wordmark { font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 34px; color: #F4F6F9; letter-spacing: -0.01em; }
  .tagline { font-family: "JetBrains Mono", monospace; font-size: 15px; letter-spacing: 0.22em; text-transform: uppercase; color: #E8640A; margin-top: 4px; }
  h1 {
    font-family: "Space Grotesk", sans-serif;
    font-weight: 700;
    font-size: 58px;
    line-height: 1.12;
    color: #F4F6F9;
    max-width: 920px;
    letter-spacing: -0.01em;
  }
  h1 .accent { color: #E8640A; }
  p.sub {
    margin-top: 26px;
    font-size: 24px;
    color: rgba(244,246,249,0.72);
    max-width: 780px;
    line-height: 1.5;
  }
  .pills { display: flex; gap: 14px; margin-top: 40px; }
  .pill {
    font-family: "JetBrains Mono", monospace;
    font-size: 15px;
    color: #F4F6F9;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 9999px;
    padding: 10px 20px;
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow glow-orange"></div>
  <div class="glow glow-blue"></div>
  <div class="content">
    <div class="logo-row">
      <div class="mark">
        <svg viewBox="0 0 76 76" xmlns="http://www.w3.org/2000/svg">
          <circle cx="25" cy="38" r="22" fill="none" stroke="#1565C0" stroke-width="1.2"/>
          <circle cx="25" cy="16" r="4" fill="#E8640A"/>
          <circle cx="47" cy="38" r="3" fill="#5B8EC9"/>
          <circle cx="25" cy="38" r="16" fill="#E8640A"/>
          <rect x="18" y="29" width="3.5" height="18" rx="1.5" fill="white"/>
          <rect x="18" y="29" width="11" height="3.5" rx="1.5" fill="white"/>
          <rect x="18" y="35.5" width="8" height="3" rx="1" fill="rgba(255,255,255,0.6)"/>
          <rect x="18" y="43.5" width="11" height="3.5" rx="1.5" fill="white"/>
        </svg>
      </div>
      <div>
        <div class="wordmark">EduErpee Technology</div>
        <div class="tagline">Simplify &middot; Automate &middot; Grow</div>
      </div>
    </div>
    <h1>AI Development, <span class="accent">Azure Cloud</span> &amp; IT Staff Augmentation</h1>
    <p class="sub">Custom ERP systems, mobile &amp; web apps, and engineering talent for schools, healthcare, retail and enterprise businesses.</p>
    <div class="pills">
      <div class="pill">AI &amp; Automation</div>
      <div class="pill">Microsoft Azure</div>
      <div class="pill">Custom ERP</div>
      <div class="pill">Staff Augmentation</div>
    </div>
  </div>
</body>
</html>
